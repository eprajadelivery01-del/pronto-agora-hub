    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .splash-logo {
        width: 150px; height: 150px;
        object-fit: contain;
        border-radius: 24px;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
      }
      #root:not(:empty) + #splash-screen {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen.hidden {
        display: none !important;
      }
      .splash-fallback {
        display: none;
        max-width: 280px;
        margin-top: 22px;
        text-align: center;
        font-family: sans-serif;
      }
      #splash-screen.recovery .splash-fallback {
        display: block;
      }
      #splash-screen.recovery .splash-loading-text,
      #splash-screen.recovery .splash-spinner {
        display: none !important;
      }
      .splash-fallback button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      .splash-reload-btn {
        background: #2563EB;
        color: white;
      }
      .splash-clear-btn {
        background: #F3F4F6;
        color: #374151;
      }
    </style>

  <body>
    <div id="root"></div>
    <div id="splash-screen">
      <img src="/logo.png?v=7" alt="&Eacute; Pra J&aacute;" class="splash-logo" style="border-radius: 20px;">
      <div class="splash-spinner" style="width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #F97316; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p class="splash-loading-text" style="margin-top: 20px; font-family: sans-serif; font-weight: bold; color: #666; font-size: 14px; letter-spacing: 2px;">CARREGANDO</p>
      <div class="splash-fallback">
        <p style="margin: 0 0 4px; color: #111827; font-size: 15px; font-weight: 800;">Falha ao abrir o painel</p>
        <p style="margin: 0; color: #6B7280; font-size: 12px; line-height: 1.4;">Isso geralmente é cache antigo ou sessão expirada neste aparelho.</p>
        <button type="button" class="splash-reload-btn" onclick="window.location.reload()">Recarregar</button>
        <button type="button" class="splash-clear-btn" onclick="window.__EPJ_CLEAR_AND_RELOAD__ && window.__EPJ_CLEAR_AND_RELOAD__()">Limpar sessão e entrar</button>
      </div>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    
    <script>
      window.__EPJ_CLEAR_AND_RELOAD__ = function () {
        try {
          var shouldRemove = function (key) {
            return key === 'epj-lojista-auth' ||
              key.indexOf('epj-lojista-auth-') === 0 ||
              key === 'sb-nptkxlrhrlssdsevpgqe-auth-token' ||
              key.indexOf('sb-nptkxlrhrlssdsevpgqe-auth-token-') === 0;
          };
          [window.localStorage, window.sessionStorage].forEach(function (storage) {
            Object.keys(storage).forEach(function (key) {
              if (shouldRemove(key)) storage.removeItem(key);
            });
          });
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) { caches.delete(key); });
            }).finally(function () {
              window.location.href = '/login?fresh=' + Date.now();
            });
            return;
          }
        } catch (error) {}
        window.location.href = '/login?fresh=' + Date.now();
      };

      // Garantir que o splash screen desapareça quando o app carregar
      const hideSplash = () => {
        const root = document.getElementById('root');
        const splash = document.getElementById('splash-screen');
        if (root && root.children.length > 0 && splash) {
          splash.classList.add('hidden');
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(() => { if (splash.parentNode) splash.remove(); }, 500);
          return true;
        }
        return false;
      };

      const splashObserver = new MutationObserver(() => {
        if (hideSplash()) splashObserver.disconnect();
      });
      const rootEl = document.getElementById('root');
      if (rootEl) {
        if (rootEl.children.length > 0) {
          hideSplash();
        } else {
          splashObserver.observe(rootEl, { childList: true });
        }
      }

      window.addEventListener('load', function () {
        setTimeout(function () {
          if (hideSplash()) return;
          var alreadyRetried = sessionStorage.getItem('epj-splash-retry-v3') === '1';
          if (!alreadyRetried) {
            sessionStorage.setItem('epj-splash-retry-v3', '1');
            window.location.replace(window.location.pathname + window.location.search + (window.location.search ? '&' : '?') + 'fresh=' + Date.now());
            return;
          }
          var splash = document.getElementById('splash-screen');
          if (splash) splash.classList.add('recovery');
        }, 7000);
      });
    </script>
