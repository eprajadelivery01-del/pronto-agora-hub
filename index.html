    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .splash-logo {
        width: 150px; height: 150px;
        object-fit: contain;
        border-radius: 24px;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
      }
      #root:not(:empty) + #splash-screen {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen.hidden {
        display: none !important;
      }
    </style>

  <body>
    <div id="root"></div>
    <div id="splash-screen">
      <img src="/logo.png?v=7" alt="&Eacute; Pra J&aacute;" class="splash-logo" style="border-radius: 20px;">
      <div style="width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #F97316; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 20px; font-family: sans-serif; font-weight: bold; color: #666; font-size: 14px; letter-spacing: 2px;">CARREGANDO</p>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    
    <script>
      // Garantir que o splash screen desapareÃ§a quando o app carregar
      const splashObserver = new MutationObserver(() => {
        const root = document.getElementById('root');
        const splash = document.getElementById('splash-screen');
        if (root && root.children.length > 0 && splash) {
          splash.classList.add('hidden');
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(() => { if (splash.parentNode) splash.remove(); }, 500);
          splashObserver.disconnect();
        }
      });
      const rootEl = document.getElementById('root');
      if (rootEl) {
        if (rootEl.children.length > 0) {
          const s = document.getElementById('splash-screen');
          if (s) s.classList.add('hidden');
        } else {
          splashObserver.observe(rootEl, { childList: true });
        }
      }
    </script>
