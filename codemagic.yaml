workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "br.com.epraja.lojista"
      node: v22.0.0

    scripts:
      - name: Install Node dependencies
        script: npm install --legacy-peer-deps

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Install manual certificate
        script: keychain add-certificates --certificate ios_distribution.p12 --certificate-password "epraja2026"

      - name: Install manual provisioning profile
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_UUID="cce9da8b-3e04-45cf-b1c5-eb3fcd3c779e"
          cp epraja_lojista_dist.mobileprovision "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          cp epraja_lojista_dist.mobileprovision "$PROFILES_DIR/epraja_lojista_dist.mobileprovision"

      - name: Validate APNs provisioning profile
        script: |
          security cms -D -i epraja_lojista_dist.mobileprovision > /tmp/epraja_profile.plist
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/epraja_profile.plist)
          PROFILE_APS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/epraja_profile.plist 2>/dev/null || true)
          case "$PROFILE_APP_ID" in
            *.$BUNDLE_ID) ;;
            *) echo "Provisioning profile pertence a '$PROFILE_APP_ID', esperado '*.$BUNDLE_ID'."; exit 1 ;;
          esac
          if [ "$PROFILE_APS" != "production" ]; then
            echo "Provisioning profile sem aps-environment=production. Gere um novo profile com Push Notifications ativo."
            exit 1
          fi
          echo "Provisioning profile APNs válido para $BUNDLE_ID."

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles --project "ios/App/$XCODE_PROJECT"

      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "")
          if [ -n "$LATEST_BUILD" ] && [ "$LATEST_BUILD" -ge 1 ]; then
            TARGET_BUILD=$(($LATEST_BUILD + 1))
          else
            TARGET_BUILD=${BUILD_NUMBER:-5}
          fi
          echo "Disparando build número: $TARGET_BUILD"
          agvtool new-version -all $TARGET_BUILD

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  android-release:
    name: Android Release (Google Play)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - epraja_keystore
      vars:
        PACKAGE_NAME: "com.eprajalojista"
      node: v22.0.0
      java: 21

    scripts:
      - name: Install Node dependencies
        script: npm install --legacy-peer-deps

      - name: Build web assets
        script: npm run build

      - name: Capacitor sync Android
        script: npx cap sync android

      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
